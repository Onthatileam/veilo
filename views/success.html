<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Successful — Veilo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0a0a0a;--paper:#f5f2ec;--accent:#e8441a;--green:#22c55e}
body{background:var(--paper);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border-radius:20px;padding:52px 48px;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(0,0,0,.08);text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:32px;animation:pop .4s ease}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:10px}
p{color:#666;font-size:15px;line-height:1.6;margin-bottom:32px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:14px 36px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s}
.btn:hover{background:#c73a15}
@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>You're all set!</h1>
  <p>Payment confirmed. Your Veilo <strong id="planName">Pro</strong> plan is now active. Start adding your team and go live.</p>
  <a href="/dashboard" class="btn">Go to dashboard →</a>
</div>
<script>
const plan = new URLSearchParams(window.location.search).get('plan') || 'pro';
document.getElementById('planName').textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
</script>
</body>
</html>
